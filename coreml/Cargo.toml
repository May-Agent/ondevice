[package]
name = "ondevice-coreml"
version = "0.0.1"
description = "Typed Core ML functions, tensors, sessions and sequence bucketing"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["headroom"]
plan = ["dep:async-channel", "objc2-core-ml/MLComputePlan", "objc2-core-ml/MLComputePlanCost", "objc2-core-ml/MLComputePlanDeviceUsage", "objc2-core-ml/MLComputeDeviceProtocol", "objc2-core-ml/MLModelStructure", "objc2-core-ml/MLModelStructureProgram", "objc2-core-ml/MLModelStructureProgramFunction", "objc2-core-ml/MLModelStructureProgramBlock", "objc2-core-ml/MLModelStructureProgramOperation", "objc2-core-ml/MLModelStructureProgramNamedValueType", "objc2-core-ml/MLModelStructureNeuralNetwork", "objc2-core-ml/MLModelStructureNeuralNetworkLayer", "objc2-core-ml/MLModelStructurePipeline"]
# Whether the host has headroom for GPU inference — mains power and a SoC
# below serious thermal pressure — and a monitor reporting its changes.
headroom = [
    "dep:objc2-core-foundation",
    "dep:objc2-io-kit",
    "objc2-foundation/NSNotification",
    "objc2-foundation/NSOperation",
    "objc2-foundation/NSProcessInfo",
]

[target.'cfg(target_vendor = "apple")'.dependencies]
async-channel = { version = "2.5.0", default-features = false, optional = true }
block2 = { version = "0.6.2", default-features = false }
half = { version = "2.7.1", default-features = false }
objc2 = { version = "0.6.5", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["block2", "CFRunLoop", "CFString"], optional = true }
objc2-core-ml = { version = "0.3.2", default-features = false, features = ["MLArrayBatchProvider", "MLBatchProvider", "MLDictionaryFeatureProvider", "MLFeatureProvider", "MLFeatureValue", "MLModel", "MLModelConfiguration", "MLModelDescription", "MLFeatureDescription", "MLMultiArrayConstraint", "MLState", "MLStateConstraint", "MLModel_MLState", "MLMultiArray", "block2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue", "block2"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["ps"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror.workspace = true

[[test]]
name = "headroom"
required-features = ["headroom"]

[dev-dependencies]
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
